<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Peak and valley">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="vale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ecf8e"/>
      <stop offset="1" stop-color="#1f9d8b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#sky)"/>

  <!-- peak side: warm sun -->
  <circle cx="18" cy="18" r="5.2" fill="url(#ridge)" opacity="0.95"/>

  <!-- the price curve: high crest then a long low valley -->
  <path d="M6 44 L18 28 L27 38 L38 47 L50 41 L58 44"
        fill="none" stroke="url(#ridge)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- valley basin -->
  <path d="M30 50 Q42 58 56 50" fill="none" stroke="url(#vale)"
        stroke-width="3.2" stroke-linecap="round"/>

  <!-- marker on the valley floor -->
  <circle cx="43" cy="54" r="2.6" fill="url(#vale)"/>
</svg>
